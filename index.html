<!DOCTYPE html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Xin Lỗi Em Yêu 💕</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
        background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        min-height: 100vh;
        overflow-x: hidden;
        position: relative;
      }

      /* Hearts background animation */
      .heart {
        position: fixed;
        font-size: 30px;
        animation: float 10s infinite ease-in-out;
        opacity: 0;
        pointer-events: none;
      }

      @keyframes float {
        0% {
          transform: translateY(100vh) rotate(0deg);
          opacity: 0;
        }
        10% {
          opacity: 1;
        }
        90% {
          opacity: 1;
        }
        100% {
          transform: translateY(-100vh) rotate(360deg);
          opacity: 0;
        }
      }

      .container {
        max-width: 800px;
        margin: 0 auto;
        padding: 40px 20px;
        text-align: center;
        position: relative;
        z-index: 1;
      }

      .main-title {
        font-size: 48px;
        color: white;
        margin-bottom: 20px;
        text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.3);
        animation: bounce 2s infinite;
      }

      @keyframes bounce {
        0%,
        100% {
          transform: translateY(0);
        }
        50% {
          transform: translateY(-10px);
        }
      }

      .subtitle {
        font-size: 24px;
        color: #ffe0f0;
        margin-bottom: 40px;
        text-shadow: 1px 1px 2px rgba(0, 0, 0, 0.2);
      }

      .message-box {
        background: rgba(255, 255, 255, 0.95);
        border-radius: 20px;
        padding: 40px;
        box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
        margin-bottom: 30px;
        backdrop-filter: blur(10px);
      }

      .sorry-message {
        font-size: 20px;
        color: #333;
        line-height: 1.8;
        margin-bottom: 20px;
        min-height: 100px;
        display: flex;
        align-items: center;
        justify-content: center;
        animation: fadeIn 1s ease-in;
      }

      @keyframes fadeIn {
        from {
          opacity: 0;
          transform: translateY(20px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }

      .emoji {
        font-size: 60px;
        margin: 20px 0;
        animation: spin 3s ease-in-out infinite;
      }

      @keyframes spin {
        0%,
        100% {
          transform: rotate(-10deg) scale(1);
        }
        50% {
          transform: rotate(10deg) scale(1.1);
        }
      }

      .button-container {
        display: flex;
        gap: 20px;
        justify-content: center;
        flex-wrap: wrap;
      }

      button {
        padding: 15px 40px;
        font-size: 18px;
        border: none;
        border-radius: 50px;
        cursor: pointer;
        transition: all 0.3s ease;
        font-weight: bold;
        box-shadow: 0 5px 15px rgba(0, 0, 0, 0.2);
      }

      .btn-next {
        background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
        color: white;
      }

      .btn-next:hover {
        transform: translateY(-3px);
        box-shadow: 0 8px 20px rgba(245, 87, 108, 0.4);
      }

      .btn-forgive {
        background: linear-gradient(135deg, #4facfe 0%, #00f2fe 100%);
        color: white;
      }

      .btn-forgive:hover {
        transform: translateY(-3px);
        box-shadow: 0 8px 20px rgba(79, 172, 254, 0.4);
      }

      .love-meter {
        margin-top: 30px;
        text-align: center;
      }

      .meter-label {
        font-size: 18px;
        color: white;
        margin-bottom: 10px;
        text-shadow: 1px 1px 2px rgba(0, 0, 0, 0.2);
      }

      .meter-bar {
        width: 100%;
        height: 30px;
        background: rgba(255, 255, 255, 0.3);
        border-radius: 15px;
        overflow: hidden;
        box-shadow: inset 0 2px 5px rgba(0, 0, 0, 0.2);
      }

      .meter-fill {
        height: 100%;
        background: linear-gradient(90deg, #ff6b6b, #ff8787, #ffa5a5);
        border-radius: 15px;
        transition: width 0.5s ease;
        display: flex;
        align-items: center;
        justify-content: flex-end;
        padding-right: 10px;
        color: white;
        font-weight: bold;
      }

      .popup {
        position: fixed;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%) scale(0);
        background: white;
        padding: 40px;
        border-radius: 20px;
        box-shadow: 0 20px 60px rgba(0, 0, 0, 0.4);
        z-index: 1000;
        transition: transform 0.3s ease;
        text-align: center;
      }

      .popup.show {
        transform: translate(-50%, -50%) scale(1);
      }

      .popup h2 {
        color: #f5576c;
        font-size: 32px;
        margin-bottom: 20px;
      }

      .popup p {
        color: #333;
        font-size: 18px;
        line-height: 1.6;
      }

      .overlay {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background: rgba(0, 0, 0, 0.7);
        z-index: 999;
        opacity: 0;
        pointer-events: none;
        transition: opacity 0.3s ease;
      }

      .overlay.show {
        opacity: 1;
        pointer-events: all;
      }

      /* Reduce motion preference */
      @media (prefers-reduced-motion: reduce) {
        * {
          animation: none !important;
          transition: none !important;
        }
      }

      /* Responsive adjustments */
      @media (max-width: 800px) {
        .container {
          padding: 30px 16px;
        }
        .main-title {
          font-size: 36px;
        }
        .subtitle {
          font-size: 20px;
        }
        .message-box {
          padding: 24px;
        }
        .sorry-message {
          font-size: 18px;
          min-height: 80px;
        }
        .emoji {
          font-size: 48px;
        }
        button {
          padding: 12px 28px;
          font-size: 16px;
        }
        .meter-bar {
          height: 24px;
        }
        .popup {
          padding: 28px;
          width: 90%;
          left: 50%;
          transform: translate(-50%, -50%) scale(0);
        }
      }

      @media (max-width: 480px) {
        body {
          background-position: center;
        }
        .container {
          max-width: 100%;
          padding: 20px 12px;
        }
        .main-title {
          font-size: 28px;
        }
        .subtitle {
          font-size: 16px;
        }
        .message-box {
          padding: 18px;
          border-radius: 14px;
        }
        .sorry-message {
          font-size: 15px;
          min-height: 60px;
        }
        .emoji {
          font-size: 40px;
        }
        .button-container {
          gap: 12px;
        }
        button {
          padding: 10px 18px;
          font-size: 15px;
        }
        .meter-label {
          font-size: 14px;
        }
        .meter-bar {
          height: 20px;
        }

        /* smaller & fewer hearts on small screens */
        .heart {
          font-size: 18px;
          animation-duration: 8s !important;
          opacity: 0.95;
        }
      }
    </style>
  </head>
  <body>
    <div class="container">
      <h1 class="main-title">Em Ơi, Anh Xin Lỗi! 😭💕</h1>
      <p class="subtitle">Anh biết anh sai rồi...</p>

      <div class="message-box">
        <div class="emoji">🥺</div>
        <div class="sorry-message" id="sorryMessage">
          Em yêu ơi, anh thật sự xin lỗi em vì những gì đã làm em buồn...
        </div>
      </div>

      <div class="button-container">
        <button class="btn-next" onclick="nextMessage()">Tiếp Theo 💌</button>
        <button class="btn-forgive" onclick="forgive()">
          Em Tha Thứ Rồi 💖
        </button>
      </div>

      <div class="love-meter">
        <div class="meter-label">
          Mức Độ Tha Thứ Của Em: <span id="meterPercent">0%</span>
        </div>
        <div class="meter-bar">
          <div class="meter-fill" id="meterFill" style="width: 0%">
            <span>❤️</span>
          </div>
        </div>
      </div>
    </div>

    <div class="overlay" id="overlay"></div>
    <div class="popup" id="popup">
      <h2>Yêu Em Nhiều Lắm! 💕💕💕</h2>
      <p>
        Cảm ơn em đã tha thứ cho anh! Anh hứa sẽ yêu thương em hơn mỗi ngày! 🥰
      </p>
    </div>

    <script>
      const sorryMessages = [
        "Em yêu ơi, anh thật sự xin lỗi em vì những gì đã làm em buồn...",
        "Anh biết anh đã sai, anh hứa sẽ không để em buồn nữa đâu! 🥺",
        "Em là người anh yêu nhất, anh không muốn mất em đâu... 💔",
        "Anh xin lỗi vì đã không lắng nghe em nhiều hơn! 😢",
        "Mỗi giây phút em buồn, anh cũng đau lòng lắm em à! 💔",
        "Anh hứa sẽ cố gắng nhiều hơn, để em luôn vui vẻ bên anh! 🌸",
        "Em có biết không, khi em buồn, thế giới của anh cũng u ám theo... 🌧️",
        "Anh xin lỗi vì đã không đủ tốt, anh sẽ cố gắng hơn nữa! 💪",
        "Em là niềm vui của anh, đừng để anh mất em nhé! 🌟",
        "Anh yêu em nhiều lắm, xin em hãy tha thứ cho anh! ❤️",
        "Nếu thời gian quay lại được, anh sẽ không làm em buồn nữa! ⏰",
        "Em là điều tuyệt vời nhất trong đời anh, anh xin lỗi em! 🌈",
        "Anh hứa sẽ yêu thương em nhiều hơn mỗi ngày! 💝",
        "Không có em, cuộc sống anh vô nghĩa lắm em à! 🥀",
        "Anh xin lỗi vì đã làm em phải rơi nước mắt... 😭",
        "Em cười đi, anh thích nhìn em cười lắm! 😊",
        "Anh sẽ làm mọi thứ để em hạnh phúc, tin anh đi em! 🌻",
        "Em là thiên thần của anh, xin đừng giận anh nữa nhé! 👼",
        "Anh biết anh ngu, nhưng anh yêu em là thật! 💕",
        "Cho anh một cơ hội để chứng minh tình yêu của anh nhé! 🎁",
      ];

      const emojis = [
        "🥺",
        "😭",
        "🙏",
        "💔",
        "😢",
        "🥹",
        "😔",
        "💕",
        "❤️",
        "🌹",
      ];

      let currentIndex = 0;
      let forgiveLevel = 0;

      function nextMessage() {
        currentIndex = (currentIndex + 1) % sorryMessages.length;
        const messageElement = document.getElementById("sorryMessage");
        const emojiElement = document.querySelector(".emoji");

        messageElement.style.animation = "none";
        setTimeout(() => {
          messageElement.textContent = sorryMessages[currentIndex];
          messageElement.style.animation = "fadeIn 1s ease-in";
        }, 10);

        emojiElement.textContent =
          emojis[Math.floor(Math.random() * emojis.length)];

        // Increase forgive level
        forgiveLevel = Math.min(100, forgiveLevel + 5);
        updateMeter();

        createHeart();
      }

      function updateMeter() {
        const fill = document.getElementById("meterFill");
        const percent = document.getElementById("meterPercent");
        fill.style.width = forgiveLevel + "%";
        percent.textContent = forgiveLevel + "%";
      }

      // Responsive intervals & heart limits
      const isMobile = () => window.innerWidth <= 600;

      let HEART_MAX = isMobile() ? 20 : 60;
      let HEART_INTERVAL = isMobile() ? 1200 : 2000;
      let MESSAGE_INTERVAL = isMobile() ? 6000 : 5000;

      let heartCount = 0;
      let heartIntervalId = null;
      let messageIntervalId = null;

      function createHeart() {
        if (heartCount >= HEART_MAX) return;
        heartCount++;

        const heart = document.createElement("div");
        heart.className = "heart";
        heart.textContent = "❤️";

        // position safer for mobile using vw and clamp
        const left = Math.random() * 100;
        heart.style.left = Math.min(Math.max(left, 3), 97) + "%";

        // duration shorter on desktop, slightly longer on mobile for smoother feel
        const baseDuration = isMobile() ? 8 : 6;
        heart.style.animationDuration = Math.random() * 4 + baseDuration + "s";
        heart.style.animationDelay = Math.random() * 1 + "s";

        document.body.appendChild(heart);

        setTimeout(() => {
          heart.remove();
          heartCount = Math.max(0, heartCount - 1);
        }, (parseFloat(heart.style.animationDuration) + 1) * 1000);
      }

      function startHeartInterval() {
        if (heartIntervalId) clearInterval(heartIntervalId);
        HEART_INTERVAL = isMobile() ? 1200 : 2000;
        HEART_MAX = isMobile() ? 20 : 60;
        heartIntervalId = setInterval(() => createHeart(), HEART_INTERVAL);
      }

      function startMessageInterval() {
        if (messageIntervalId) clearInterval(messageIntervalId);
        MESSAGE_INTERVAL = isMobile() ? 6000 : 5000;
        messageIntervalId = setInterval(() => nextMessage(), MESSAGE_INTERVAL);
      }

      // initialize and respond to resize changes
      startHeartInterval();
      startMessageInterval();

      window.addEventListener("resize", () => {
        // throttle quick resizes
        clearTimeout(window._resizeTimeout);
        window._resizeTimeout = setTimeout(() => {
          startHeartInterval();
          startMessageInterval();
        }, 250);
      });

      // when user forgives, create celebration hearts but respect HEART_MAX
      function forgive() {
        document.getElementById("overlay").classList.add("show");
        document.getElementById("popup").classList.add("show");

        const burst = isMobile() ? 12 : 24;
        for (let i = 0; i < burst; i++) {
          setTimeout(() => createHeart(), i * 80);
        }

        setTimeout(() => {
          document.getElementById("overlay").classList.remove("show");
          document.getElementById("popup").classList.remove("show");
        }, 3000);
      }

      // Auto cycle messages
      setInterval(() => {
        nextMessage();
      }, 5000);
    </script>
  </body>
</html>
